#:schema https://yazi-rs.github.io/schemas/yazi.json

# yazi は既定値をバイナリに内蔵していて、この設定はその「上に重なる」。
# だから変えたい項目だけを書く。全文コピーを置くと yazi の更新でキー名が
# 変わるたびに起動できなくなる（2026-11-03 に実際に踏んだ）。
# 公式: https://yazi-rs.github.io/docs/configuration/overview
#   "you don't need to copy the entire file unless you want to completely overwrite them"
#
# 既定値の全文を見たいとき（更新したら URL のタグも上げる）:
#   https://github.com/sxyazi/yazi/blob/v26.5.6/yazi-config/preset/yazi-default.toml

[opener]
# Windows でテキストを開く先を code ではなく nvim にする。
# opener は「名前ごとのリスト」なので、差し替える名前だけはリスト全体を書く
# （リスト単位の上書きで、要素だけ足す仕組みは無い）。
edit = [
	{ run = "${EDITOR:-vi} %s", desc = "$EDITOR",      for = "unix",    block = true },
	{ run = "nvim %s",          desc = "nvim",         for = "windows", block = true },
	{ run = "code %s",          desc = "code",         for = "windows", orphan = true },
	{ run = "code -w %s",       desc = "code (block)", for = "windows", block = true },
]

# `O`（開き方を選んで開く）の選択肢に「その場所で Windows Terminal を開く」を足す。
# `<Enter>` / `o` は先頭の start が使われるので、既定の挙動は変わらない。
open = [
	{ run = "xdg-open %s1",    desc = "Open", for = "linux" },
	{ run = "open %s",         desc = "Open", for = "macos" },
	{ run = 'start "" %s1',    desc = "Open", for = "windows", orphan = true },
	{ run = "termux-open %s1", desc = "Open", for = "android" },
	{ run = "wt -d %s1",       desc = "Windows Terminal", for = "windows", orphan = true },
]
