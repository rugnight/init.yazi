#:schema https://yazi-rs.github.io/schemas/keymap.json

# 既定のキーに「足す・上書きする」だけ。prepend_keymap は既定より先に評価される。
# 全キーの一覧は yazi の中で `~`（または F1）。`f` で絞り込める。
# 日本語の早見表は ../README.md（nvim からは <Space>? で開く）。
#
# 既定値の全文（yazi を更新したらタグも上げて差分を見る）:
#   https://github.com/sxyazi/yazi/blob/v26.5.6/yazi-config/preset/keymap-default.toml

[mgr]
prepend_keymap = [
	# 既定は 2 打鍵の `tt`。1 打鍵にする代わり `tr`（タブ名の変更）は押せなくなる。
	{ on = "t", run = "tab_create --current", desc = "新しいタブ（今の場所）" },

	# ブックマーク（yamb プラグイン。登録先は ../init.lua と ../bookmark）
	# プラグイン引数は yazi 25.5.31 以降 `plugin 名 -- 引数` の形。
	# <C-b> は既定では「1 ページ上へ」。そちらは <PageUp> で代替できる。
	{ on = "<C-b>",      run = "plugin yamb -- save",            desc = "ブックマークを追加" },
	{ on = "B",          run = "plugin yamb -- jump_by_fzf",     desc = "ブックマークへジャンプ（fzf）" },
	{ on = [ "b", "b" ], run = "plugin yamb -- jump_by_key",     desc = "ブックマークへジャンプ（割当キー）" },
	{ on = [ "b", "d" ], run = "plugin yamb -- delete_by_fzf",   desc = "ブックマークを削除" },
	{ on = [ "b", "A" ], run = "plugin yamb -- delete_all",      desc = "ブックマークを全部削除" },
	{ on = [ "b", "r" ], run = "plugin yamb -- rename_by_fzf",   desc = "ブックマークの名前を変更" },
]
